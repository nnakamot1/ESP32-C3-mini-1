; PlatformIO Project Configuration
; ESP32-C3 Mini — ESP-IDF framework
; Switch active env via the PlatformIO toolbar or: pio run -e <env-name>

[platformio]
default_envs = lab3_3

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
extra_scripts = pre:select_lab.py

[env:lab1_2]
; Hello World — prints chip info and restarts

[env:lab1_3]
; LED blink — onboard WS2812 addressable RGB LED on GPIO8
build_flags =
	-DCONFIG_BLINK_LED_STRIP=1
	-DCONFIG_BLINK_LED_STRIP_BACKEND_RMT=1
	-DCONFIG_BLINK_PERIOD=1000

[env:lab2_2]
; SHTC3 temperature/humidity sensor via I2C (new master API)

[env:lab3_2]
; DFRobot RGB LCD1602 — "Hello CSE121! / Nakamoto" (I2C SCL=0, SDA=1)

[env:lab3_3]
; SHTC3 + RGB LCD1602 temperature monitor (I2C SDA=1, SCL=0)

[env:lab4_1]
; Orientation direction printer via ICM-42670-P accelerometer (I2C SCL=8, SDA=10)

[env:lab4_2]
; BLE HID mouse - auto-sweeps cursor right/left on a fixed timer once connected, no sensor

[env:lab4_3]
; BLE HID tilt-controlled mouse via ICM-42670-P accelerometer (I2C SCL=8, SDA=10)

[env:lab5_2]
; Optical Morse receiver + onboard LED transmitter (GPIO4) - self-contained,
; no Pi or PC screen needed. Photoresistor on ADC1 channel 3 (GPIO3), unit=100ms.
build_flags =
	-DTX_MESSAGE=\"SOS\"
	-DLED_GPIO_NUM=4

[env:lab5_3]
; Optical Morse receiver + onboard LED transmitter (GPIO4) - self-contained,
; no Pi or PC screen needed. Photoresistor on ADC1 channel 3 (GPIO3), unit=100ms.
build_flags =
	-DTX_MESSAGE=\"SOS\"
	-DLED_GPIO_NUM=4

[env:lab5_loopback]
; Self-contained Morse test (no Pi needed) — one board both transmits (LED on
; GPIO4) and receives (photoresistor on ADC1 ch3 / GPIO3), unit=20ms.
build_flags =
	-DTX_MESSAGE=\"SOS\"
	-DLED_GPIO_NUM=4

[env:lab6_1]
; SHTC3 temp/humidity (I2C SCL=8 SDA=10) + HC-SR04 ultrasonic distance (TRIG=4 ECHO=5)

[env:distance_lcd]
; Distance meter — LCD1602 (I2C SDA=1 SCL=0) shows live ultrasonic distance
; (TRIG=4 ECHO=5) and temperature-corrected speed of sound via SHTC3
; (software I2C SDA=10 SCL=8). No WiFi.

[env:lab7_1]
; Weather station part 1 - WiFi + GET temperature from wttr.in
build_flags =
	-DWIFI_SSID=\"***\"
	-DWIFI_PASS=\"***\"

[env:lab7_2]
; Weather station part 2 - onboard temp sensor -> POST to server:1234
build_flags =
	-DWIFI_SSID=\"***\"
	-DWIFI_PASS=\"***\"
	-DSERVER_IP=\"***\"

[env:lab7_3]
; Weather station part 3 - GET server location, GET wttr.in, POST both readings
build_flags =
	-DWIFI_SSID=\"***\"
	-DWIFI_PASS=\"***\"
	-DSERVER_IP=\"***\"

[env:weather_lcd]
; Weather station — WiFi + LCD1602: one wttr.in GET returns location, temp,
; condition, and humidity, then the LCD cycles between a location screen and
; a weather screen, re-fetching every 60s.
build_flags =
	-DWIFI_SSID=\"SpectrumSetup-A2\"
	-DWIFI_PASS=\"lotussummit597\"

[env:selflab1_1]
; BLE HID mouse (copy of lab4_2's sweep demo) tuned for Windows 11 pairing:
; unique device name "SelfLab11-Mouse", appearance=Mouse (0x03c2) instead of Generic HID

[env:selflab1_2]
; BLE HID tilt-controlled mouse (copy of lab4_3, ICM-42670-P accelerometer, I2C SCL=8 SDA=10)
; tuned for Windows 11 pairing: unique device name "SelfLab12-Mouse" (appearance was already Mouse)
