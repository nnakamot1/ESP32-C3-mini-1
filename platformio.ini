; PlatformIO Project Configuration
; ESP32-C3 Mini — ESP-IDF framework
; Switch active env via the PlatformIO toolbar or: pio run -e <env-name>

[platformio]
default_envs = lab3_3

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
extra_scripts = pre:select_lab.py

[env:lab1_2]
; Hello World — prints chip info and restarts

[env:lab1_3]
; LED blink — onboard WS2812 addressable RGB LED on GPIO8
build_flags =
	-DCONFIG_BLINK_LED_STRIP=1
	-DCONFIG_BLINK_LED_STRIP_BACKEND_RMT=1
	-DCONFIG_BLINK_PERIOD=1000

[env:lab2_2]
; SHTC3 temperature/humidity sensor via I2C (new master API)

[env:lab3_2]
; DFRobot RGB LCD1602 — "Hello CSE121! / Nakamoto" (I2C SCL=0, SDA=1)

[env:lab3_3]
; SHTC3 + RGB LCD1602 temperature monitor (I2C SCL=8, SDA=10)

[env:lab4_1]
; Orientation direction printer via ICM-42670-P accelerometer (I2C SCL=8, SDA=10)

[env:lab4_2]
; BLE HID mouse - auto-sweeps cursor right/left on a fixed timer once connected, no sensor

[env:lab4_3]
; BLE HID tilt-controlled mouse via ICM-42670-P accelerometer (I2C SCL=8, SDA=10)

[env:lab5_2]
; Optical Morse code receiver via photoresistor on ADC1 channel 3 (GPIO3), unit=20ms

[env:lab5_3]
; Optical Morse code receiver via photoresistor on ADC1 channel 3 (GPIO3), unit=18ms

[env:lab6_1]
; SHTC3 temp/humidity (I2C SCL=8 SDA=10) + HC-SR04 ultrasonic distance (TRIG=4 ECHO=5)

[env:lab7_1]
; Weather station part 1 - WiFi + GET temperature from wttr.in
build_flags =
	-DWIFI_SSID=\"***\"
	-DWIFI_PASS=\"***\"

[env:lab7_2]
; Weather station part 2 - onboard temp sensor -> POST to server:1234
build_flags =
	-DWIFI_SSID=\"***\"
	-DWIFI_PASS=\"***\"
	-DSERVER_IP=\"***\"

[env:lab7_3]
; Weather station part 3 - GET server location, GET wttr.in, POST both readings
build_flags =
	-DWIFI_SSID=\"***\"
	-DWIFI_PASS=\"***\"
	-DSERVER_IP=\"***\"

[env:selflab1_1]
; BLE HID mouse (copy of lab4_2's sweep demo) tuned for Windows 11 pairing:
; unique device name "SelfLab11-Mouse", appearance=Mouse (0x03c2) instead of Generic HID

[env:selflab1_2]
; BLE HID tilt-controlled mouse (copy of lab4_3, ICM-42670-P accelerometer, I2C SCL=8 SDA=10)
; tuned for Windows 11 pairing: unique device name "SelfLab12-Mouse" (appearance was already Mouse)
